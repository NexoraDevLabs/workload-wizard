# ---------- Product & App Layers ----------
'app:web':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**'
          - 'app/**'
          - 'pages/**'
          - 'components/**'
          - 'public/**'
          - '**/*.tsx'
          - '**/*.css'
          - '**/*.scss'

'app:api':
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/api/**'
          - 'api/**'
          - 'server/**'
          - 'convex/**'
          - 'src/**/*api*'
          - 'src/**/*server*'
          - '**/*.ts'

# ---------- Design / Assets ----------
design:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/design/**'
          - 'docs/assets/**'
          - 'docs/user-guide/**'
          - '**/*.fig'
          - '**/*.svg'

# ---------- Documentation ----------
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '**/*.md'
          - '**/*.mdx'
          - 'mkdocs.yml'

# ---------- CI / Infra / DevOps ----------
ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/*.yml'
          - '.github/*.yaml'

infra:
  - changed-files:
      - any-glob-to-any-file:
          - 'infra/**'
          - 'Dockerfile'
          - 'compose*.yml'
          - '.npmrc'
          - '.nvmrc'
          - 'tsconfig.json'
          - 'eslint.config.*'
          - 'commitlint.config.*'
          - 'cz.config.*'

# ---------- Dependencies / Tooling ----------
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - '**/package.json'
          - '**/package-lock.json'

'pkg:config':
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.json'
          - '**/*.yaml'
          - '**/*.yml'

# ---------- Code movement / Perf ----------
refactor:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**'
          - 'api/**'
          - 'server/**'

performance:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**'
          - 'api/**'
          - 'server/**'

# ---------- Quality / Testing ----------
test:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'
          - '__tests__/**'
          - '**/*.{test,spec}.{cjs,mjs,js,jsx,ts,tsx}'

# ---------- Security ----------
security:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/security/**'
          - 'docs/operations/runbooks/incident-response.md'
          - 'src/**/*auth*'
          - 'src/**/*token*'
          - 'src/**/*crypto*'
          - 'src/**/*secret*'

# ---------- Styling ----------
style:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.css'
          - '**/*.scss'
          - '**/*.sass'
