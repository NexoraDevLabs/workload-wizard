name: Feature request
description: Propose an enhancement
labels: ["type/feat"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who benefits and why?
    validations: { required: true }
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Brief of the UX/API and acceptance criteria
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: risks
    attributes:
      label: Risks/unknowns
