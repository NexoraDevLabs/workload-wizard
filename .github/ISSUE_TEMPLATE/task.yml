name: '📝 Task'
description: Track a specific piece of work
labels: [task]
title: '[TASK] '
body:
  - type: textarea
    id: task
    attributes:
      label: Task Description
      description: What needs to be done?
      placeholder: 'Implement API route for workload summaries'
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What conditions must be met?
      placeholder: "- [ ] Returns correct data\n- [ ] Tested with sample input"

  - type: input
    id: related
    attributes:
      label: Related Issues / PRs
      description: Link any related issues or pull requests
