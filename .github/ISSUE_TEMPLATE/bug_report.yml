name: Bug report
description: Report a bug
labels: ["type/bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce
      value: |
        1.
        2.
        3.
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "browser/os, branch, commit"
  - type: textarea
    id: logs
    attributes:
      label: Logs/errors
      render: shell
