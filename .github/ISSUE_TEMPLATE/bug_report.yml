name: '🐛 Bug Report'
description: Report something that isn't working as expected
labels: [bug]
title: '[BUG] '
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
      placeholder: 'When I click X, Y happens instead of Z.'
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the bug?
      placeholder: "1. Go to ...\n2. Click ...\n3. Observe ..."
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node/pnpm/browser/version info
      placeholder: 'Node 20.19.4, pnpm 10.15.0, Chrome 128'
