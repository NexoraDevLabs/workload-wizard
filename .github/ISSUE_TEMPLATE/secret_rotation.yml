name: 🔐 Secret Rotation
description: Plan and execute secret rotation for WorkloadWizard services
title: "[ROTATION] "
labels: ["type:maintenance", "priority:medium"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Secret Rotation Plan
        
        Use this template to plan and track secret rotation for WorkloadWizard services. This ensures proper documentation and coordination of secret updates.

  - type: dropdown
    id: rotation_type
    attributes:
      label: Rotation Type
      description: What type of rotation is this?
      options:
        - Scheduled (regular rotation)
        - Emergency (suspected exposure)
        - Personnel change (team member departure)
        - Security incident (compromise detected)
        - Compliance (audit requirement)
        - Other
    validations:
      required: true

  - type: checkboxes
    id: systems
    attributes:
      label: Systems to Rotate
      description: Which systems require secret rotation?
      options:
        - label: Vercel (environment variables)
        - label: Convex (deployment keys)
        - label: Clerk (API keys, webhook secrets)
        - label: Upstash/Redis (REST tokens, connection URLs)
        - label: Statsig (server/API keys)
        - label: GitHub Actions (secrets, environment secrets)
        - label: Other (specify in description)

  - type: input
    id: secret_name
    attributes:
      label: Secret Name
      description: Name of the secret being rotated
      placeholder: "e.g., VERCEL_TOKEN, CONVEX_DEPLOY_KEY, CLERK_SECRET_KEY"
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Rotation Reason
      description: Why is this secret being rotated?
      placeholder: |
        - Scheduled rotation (90/180 day cycle)
        - Suspected exposure or compromise
        - Team member access changes
        - Security incident response
        - Compliance requirement
        - Other reason
    validations:
      required: true

  - type: textarea
    id: rotation_plan
    attributes:
      label: Rotation Plan
      description: Detailed steps for rotating the secret
      placeholder: |
        1. Generate new secret
        2. Update staging environment
        3. Validate staging functionality
        4. Update production environment
        5. Verify production functionality
        6. Remove old secret
        7. Update documentation
    validations:
      required: true

  - type: textarea
    id: verification_steps
    attributes:
      label: Verification Steps
      description: How will you verify the rotation was successful?
      placeholder: |
        - Test authentication flows
        - Verify API connectivity
        - Check application logs
        - Run smoke tests
        - Monitor error rates
    validations:
      required: true

  - type: textarea
    id: rollback_plan
    attributes:
      label: Rollback Plan
      description: What will you do if the rotation fails?
      placeholder: |
        - Revert to previous secret value
        - Redeploy affected services
        - Notify stakeholders
        - Investigate root cause
        - Schedule retry
    validations:
      required: true

  - type: input
    id: scheduled_time
    attributes:
      label: Scheduled Time
      description: When is this rotation planned? (UTC)
      placeholder: "2024-01-15 14:00:00 UTC"
    validations:
      required: true

  - type: textarea
    id: stakeholders
    attributes:
      label: Stakeholders to Notify
      description: Who needs to be informed about this rotation?
      placeholder: |
        - @username (Platform Owner)
        - @username (Security Lead)
        - @username (On-call Engineer)
        - External stakeholders (if needed)

  - type: textarea
    id: additional_info
    attributes:
      label: Additional Information
      description: Any other relevant information
      placeholder: |
        - Special considerations
        - Dependencies on other systems
        - Expected downtime (if any)
        - Links to related issues or documentation
