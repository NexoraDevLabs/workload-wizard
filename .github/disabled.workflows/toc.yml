name: Docs TOC Updater

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: toc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-toc:
    name: Update README TOC
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }} # trusted (not fork)
    steps:
      - uses: actions/checkout@v4

      - name: Generate TOC (README.md)
        uses: technote-space/toc-generator@v4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_PATHS: README.md,docs/**/*.md
          TOC_TITLE: "## Table of contents"
          # adds <!-- START doctoc --> markers if absent

      - name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "docs: update TOC"
            git push
          else
            echo "TOC already up-to-date."
          fi
