name: Validate CODEOWNERS

on:
  pull_request:
    paths:
      - "CODEOWNERS"
      - ".github/CODEOWNERS"
      - "docs/CODEOWNERS"
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main, dev]
    paths:
      - "CODEOWNERS"
      - ".github/CODEOWNERS"
      - "docs/CODEOWNERS"
  workflow_dispatch: {}

permissions:
  contents: read
  # Needed for the artifact cleanup job on private repos
  actions: write

concurrency:
  group: codeowners-validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gh_status:
    name: GitHub status
    runs-on: ubuntu-latest
    steps:
      - uses: crazy-max/ghaction-github-status@v4.2.0
        with:
          overall_threshold: minor
          actions_threshold: degraded_performance
          api_threshold: degraded_performance

  validate:
    name: codeowners-validator
    needs: gh_status
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run CODEOWNERS validator
        uses: mszostok/codeowners-validator@v0.7.4
        with:
          checks: "files,duppatterns,syntax"
          experimental_checks: "notowned,avoid-shadowing"
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

  cleanup_artifacts:
    name: Artifact janitor
    needs: validate
    # Only clean up on trusted contexts (push/dispatch), not PRs
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove old artifacts (keep latest 10 and all tag builds)
        uses: c-hive/gha-remove-artifacts@v1.4.0
        with:
          # Delete artifacts older than 14 days across the repo
          age: "14 days"
          # Keep the most recent 10 artifacts regardless of age
          skip-recent: 10
          # Never delete artifacts created on tag workflows (release builds)
          skip-tags: true
