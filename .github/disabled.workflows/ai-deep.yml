name: AI Deep PR Review

on:
  pull_request:
    # Re-run when code changes, label toggled, or PR becomes ready
    types: [opened, reopened, synchronize, ready_for_review, labeled]
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-deep-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gh_status:
    name: GitHub status
    runs-on: ubuntu-latest
    steps:
      - uses: crazy-max/ghaction-github-status@v4.2.0
        with:
          overall_threshold: minor
          actions_threshold: degraded_performance
          api_threshold: degraded_performance

  deep-review:
    name: Run PR-Agent (Deep Model)
    # Only for trusted PRs (same-repo) AND when the 'ai:review-deep' label is set
    if: ${{ !github.event.pull_request.head.repo.fork && contains(github.event.pull_request.labels.*.name, 'ai:review-deep') }}
    needs: gh_status
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: PR-Agent review
        id: pr_agent
        uses: qodo-ai/pr-agent@v0.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_AGENT_SETTINGS: |
            {
              "general": {
                "language": "en-GB",
                "inline_comments": true,
                "max_review_comments": 25,
                "respect_codeowners": true,
                "model": "gpt-4o"
              },
              "reviews": {
                "diff_only": true,
                "max_files": 50,
                "max_file_size_kb": 500,
                "skip_large_prs": true
              }
            }

      # Add a label to indicate the AI deep review has completed successfully
      - name: Add "ai:reviewed" label
        if: ${{ success() }}
        uses: actions/github-script@v7
        with:
          script: |
            const hasLabel = (github.context.payload.pull_request.labels || [])
              .some(l => l.name === 'ai:reviewed');
            if (!hasLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['ai:reviewed']
              });
            }
