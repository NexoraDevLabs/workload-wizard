name: Setup and Cache Dependencies

on:
  workflow_call:
    inputs:
      node-version-file:
        description: "Path to .nvmrc (or set an explicit version via setup-node in the caller)."
        required: false
        type: string
        default: ".nvmrc"
      use-queue:
        description: "Serialize runs per-branch to avoid overlapping installs."
        required: false
        type: boolean
        default: true
      run-artifact-cleanup:
        description: "If true, run artifact janitor after install (push/dispatch only)."
        required: false
        type: boolean
        default: false
    outputs:
      pm:
        description: "Detected package manager (pnpm|npm)."
        value: ${{ jobs.install.outputs.pm }}
      node-version:
        description: "Resolved Node.js version."
        value: ${{ jobs.install.outputs.node-version }}

permissions:
  contents: read

concurrency:
  # Safe default: don't cancel dependency setup mid-run for the same ref
  group: deps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gh_status:
    name: GitHub status
    runs-on: ubuntu-latest
    steps:
      - uses: crazy-max/ghaction-github-status@v4.2.0
        with:
          overall_threshold: minor
          actions_threshold: degraded_performance
          api_threshold: degraded_performance

  install:
    name: Install & Cache
    needs: gh_status
    runs-on: ubuntu-latest
    outputs:
      pm: ${{ steps.pm.outputs.name }}
      node-version: ${{ steps.node.outputs.node-version }}
    steps:
      # Optional queue to serialize concurrent calls from multiple workflows on the same ref
      - name: Queue (per branch)
        if: inputs.use-queue == true
        uses: ahmadnassri/action-workflow-queue@v1
        with:
          timeout: 30m

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Node (also exposes resolved version via step output)
      - name: Setup Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ inputs['node-version-file'] }}

      # Detect lockfile / package manager
      - name: Detect package manager
        id: pm
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            echo "name=pnpm" >> "$GITHUB_OUTPUT"
          elif [[ -f package-lock.json ]]; then
            echo "name=npm" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No lockfile found (pnpm-lock.yaml or package-lock.json)."
            exit 1
          fi
          echo "Detected PM: $(grep -oP '(?<=name=).*' "$GITHUB_OUTPUT" || true)"

      # Setup pnpm (when applicable)
      - name: Setup pnpm
        if: steps.pm.outputs.name == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Cache: pnpm store
      - name: Cache pnpm store
        if: steps.pm.outputs.name == 'pnpm'
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-pnpm-

      # Cache: npm cache dir
      - name: Locate npm cache dir
        if: steps.pm.outputs.name == 'npm'
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm
        if: steps.pm.outputs.name == 'npm'
        uses: actions/cache@v4
        with:
          path: ${{ steps['npm-cache-dir'].outputs.dir }}
          key: ${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-npm-

      # Install dependencies
      - name: Install (pnpm)
        if: steps.pm.outputs.name == 'pnpm'
        run: pnpm install --frozen-lockfile

      - name: Install (npm)
        if: steps.pm.outputs.name == 'npm'
        run: npm ci

  cleanup_artifacts:
    name: Artifact janitor
    needs: install
    if: |
      always() &&
      inputs.run-artifact-cleanup == true &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Remove old artifacts (keep latest 10 and all tag builds)
        uses: c-hive/gha-remove-artifacts@v1.4.0
        with:
          age: "14 days"
          skip-recent: 10
          skip-tags: true
