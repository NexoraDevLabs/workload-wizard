name: Sync Labels

on:
  push:
    paths: [".github/labels.yml"]
    branches: [main, dev]
  workflow_dispatch: {}
  schedule:
    - cron: "19 4 * * 1" # weekly (Mon 04:19 UTC)

permissions:
  contents: read
  issues: write

concurrency:
  group: label-sync
  cancel-in-progress: false

jobs:
  gh_status:
    name: GitHub status
    runs-on: ubuntu-latest
    steps:
      - uses: crazy-max/ghaction-github-status@v4.2.0
        with:
          overall_threshold: minor
          actions_threshold: degraded_performance
          api_threshold: degraded_performance

  sync:
    name: Apply label manifest
    needs: gh_status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sync labels from .github/labels.yml
        uses: micnncim/action-label-syncer@v1.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          manifest: .github/labels.yml
          # Set to false if you want to preserve ad-hoc labels
          prune: true

  cleanup_artifacts:
    name: Artifact janitor
    needs: sync
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Remove old artifacts (keep latest 10 and all tag builds)
        uses: c-hive/gha-remove-artifacts@v1.4.0
        with:
          age: "14 days"
          skip-recent: 10
          skip-tags: true
