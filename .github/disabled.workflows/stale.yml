name: Close Stale Issues

on:
  schedule:
    - cron: '32 3 * * *' # runs daily at 03:32 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: stale-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  gh_status:
    name: GitHub status
    runs-on: ubuntu-latest
    steps:
      - uses: crazy-max/ghaction-github-status@v4.2.0
        with:
          overall_threshold: minor
          actions_threshold: degraded_performance
          api_threshold: degraded_performance

  stale:
    name: Mark and close stale issues/PRs
    needs: gh_status
    runs-on: ubuntu-latest
    steps:
      - name: Run stale sweep
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Timing
          days-before-stale: 45
          days-before-close: 7

          # Labels
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'

          # Exemptions (won’t be marked stale)
          exempt-issue-labels: 'priority:critical,priority:high,status:in-progress,status:blocked'
          exempt-pr-labels: 'priority:critical,priority:high,status:in-progress,status:blocked'

          # Behaviour
          remove-stale-when-updated: true
          operations-per-run: 200
          ascending: false

          # Messages
          stale-issue-message: >
            This issue has been automatically marked **stale** due to 45 days of inactivity.
            It will be closed in 7 days unless there’s new activity. If this is still relevant,
            please add a comment or apply a non-stale label (e.g., `status:in-progress`).
          close-issue-message: >
            Closing due to inactivity. If this is still a priority, feel free to reopen
            or file a new issue with updated context. Thanks!

          stale-pr-message: >
            This pull request has been marked **stale** due to 45 days without updates.
            It will be closed in 7 days unless there’s new activity. Please push changes,
            request review, or add `status:in-progress` to keep it open.
          close-pr-message: >
            Closing this PR due to inactivity. You can reopen when it’s ready for another review.

          # Optional: only sweep open items
          only-labels: ''

  cleanup_artifacts:
    name: Artifact janitor
    needs: stale
    if: |
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Remove old artifacts (keep latest 10 and all tag builds)
        uses: c-hive/gha-remove-artifacts@v1.4.0
        with:
          age: '14 days'
          skip-recent: 10
          skip-tags: true
