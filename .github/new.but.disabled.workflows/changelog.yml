name: Changelog (Unreleased updater)

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      # Resolve Nexoroid creds (repo override -> org secret)
      - name: Resolve Nexoroid app credentials
        id: resolve
        env:
          RESOLVED_APP_ID: ${{ secrets.APP_ID || secrets.NEXOROID_APP_ID }}
          RESOLVED_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY || secrets.NEXOROID_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${RESOLVED_APP_ID}" ] || [ -z "${RESOLVED_PRIVATE_KEY}" ]; then
            echo "❌ Missing Nexoroid App credentials."
            echo "   Set repo secrets APP_ID/APP_PRIVATE_KEY or org secrets NEXOROID_APP_ID/NEXOROID_APP_PRIVATE_KEY."
            exit 1
          fi
          echo "::add-mask::${RESOLVED_PRIVATE_KEY}"
          {
            echo "app_id=${RESOLVED_APP_ID}"
            echo "private_key<<EOF"
            echo "${RESOLVED_PRIVATE_KEY}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Get Nexoroid app token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2
        with:
          app-id: ${{ steps.resolve.outputs.app_id }}
          private-key: ${{ steps.resolve.outputs.private_key }}

      - name: Checkout (full history) with Nexoroid token
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate CHANGELOG.md (PRs only, labelled, curated order)
        uses: janheinrichmerker/action-github-changelog-generator@e60b5a2bd9fcd88dadf6345ff8327863fb8b490f # v2.4
        with:
          token: ${{ steps.app-token.outputs.token }}
          output: CHANGELOG.md

          # Keep an "Unreleased" section up top
          unreleased: true
          unreleasedLabel: Unreleased
          releaseBranch: main
          compareLink: true
          filterByMilestone: false

          # PRs only (avoid duplicate issue lines) & require labels
          issues: false
          pullRequests: true
          prWoLabels: false

          # Exclude noise
          excludeLabels: 'wontfix,duplicate,invalid,question,Meta: Exclude From Changelog'

          # Sections & order (ensure labels exist)
          configureSections: |
            {
              "breaking":       {"prefix":"### ⚠️ Breaking changes","labels":["breaking-change","breaking"]},
              "enhancements":   {"prefix":"### ✨ Enhancements","labels":["enhancement","feature"]},
              "bugs":           {"prefix":"### 🐛 Fixes","labels":["bug","regression"]},
              "documentation":  {"prefix":"### 📚 Documentation","labels":["docs","documentation"]},
              "maintenance":    {"prefix":"### 🧰 Maintenance","labels":["chore","ci","build","refactor"]}
            }

          # Inline labels & authors
          author: true

          # Small HTTP cache
          httpCache: true
          cacheFile: .changelog-http-cache
          cacheLog: false

          # Drop generator footer
          stripGeneratorNotice: true

      - name: Reposition "Full Changelog" links
        run: |
          python - <<'PY'
          import re, io
          p="CHANGELOG.md"; t=io.open(p,"r",encoding="utf-8").read()
          parts=re.split(r'(?m)^(## \[.*?\].*?\n)',t)
          if len(parts)<3: raise SystemExit(0)
          out=[parts[0]]
          for i in range(1,len(parts),2):
            h, b=parts[i], parts[i+1]
            lines=b.splitlines(True); fc=[]; kept=[]
            for ln in lines:
              if re.match(r'^\s*\[?Full Changelog\]?\s*[:(]', ln): fc.append(ln)
              else: kept.append(ln)
            while kept and kept[-1].strip()=="":
              kept.pop()
            if fc:
              kept.append("\n"); kept.extend(fc)
              if kept[-1][-1]!="\n": kept.append("\n")
            out += [h, "".join(kept)]
          io.open(p,"w",encoding="utf-8").write("".join(out))
          PY

      - name: Commit changes (as Nexoroid)
        id: commit
        env:
          NX_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          CHANGED="no"
          if ! git diff --quiet -- CHANGELOG.md; then
            CHANGED="yes"
            git config user.name  "Nexoroid"
            git config user.email "nexoroid[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "docs(changelog): update Unreleased"
            # Ensure pushes use the app token
            git remote set-url origin "https://x-access-token:${NX_TOKEN}@github.com/${{ github.repository }}.git"
            git push
          fi
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"

      # ---------- Job Summary ----------
      - name: Write job summary
        if: ${{ always() }}
        env:
          BRANCH: ${{ github.ref_name }}
          JOB_STATUS: ${{ job.status }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          COMPARE_URL="https://github.com/${REPO}/compare/main...${BRANCH}"
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"

          {
            echo "## 📝 Changelog (Unreleased updater)"
            echo ""
            echo "- **Branch:** \`${BRANCH:-unknown}\`"
            echo "- **Status:** \`${JOB_STATUS:-unknown}\`"
            echo "- **CHANGELOG.md updated:** \`${CHANGED:-no}\`"
            echo ""
            echo "### 🔗 Handy links"
            echo "- Compare (main → ${BRANCH}): ${COMPARE_URL}"
            echo "- Latest commit: ${COMMIT_URL}"
            echo ""
            echo "### 🔍 Unreleased section preview"
            echo ""
            if [ -f CHANGELOG.md ]; then
              # Print from '## [Unreleased]' until the next '## [' (or up to 80 lines)
              awk 'BEGIN{p=0} /^## \[Unreleased\]/{p=1; next} /^## \[/{if(p) exit} {if(p) print}' CHANGELOG.md | head -n 80
              if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
                echo "_No explicit Unreleased section found._"
              fi
            else
              echo "_No CHANGELOG.md found in workspace._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
