name: Spelling

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: write

jobs:
  codespell:
    runs-on: ubuntu-latest

    steps:
      # Create an installation token for the Nexoroid GitHub App
      - name: Create Nexoroid app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NEXOROID_APP_ID }}
          private-key: ${{ secrets.NEXOROID_PEM }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      # Optional sanity check (no secrets printed)
      - name: Validate key looks like a PEM (header only)
        run: |
          header="$(printf '%s\n' "${{ secrets.NEXOROID_PEM }}" | sed -n '1p')"
          case "$header" in
            "-----BEGIN RSA PRIVATE KEY-----"|"-----BEGIN PRIVATE KEY-----") echo "PEM header OK";;
            *) echo "::warning title=Private key format::First line is not a PEM header. Re-save the key with real newlines."; exit 1;;
          esac

      - name: Install codespell
        run: pip install codespell

      - name: Run codespell (UK + US English) with autofix
        run: |
          codespell --write-changes \
            --check-filenames \
            --skip "node_modules,dist,.git" \
            --ignore-words-list crate,nd,referer \
            --ignore-words .github/codespell-ignore.txt || true

      # Only push from trusted contexts (no pushes on PRs from forks)
      - name: Commit & push fixes (trusted branches only)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        run: |
          if ! git diff --quiet; then
            git config user.name "Nexoroid"
            git config user.email "nexoroid[bot]@users.noreply.github.com"
            git add -u
            git commit -m "chore(spellcheck): auto-fix spelling with codespell"
            git push
            echo "pushed=1" >> $GITHUB_OUTPUT
          else
            echo "pushed=0" >> $GITHUB_OUTPUT
          fi
        id: push

      - name: Summarise results
        if: always()
        run: |
          echo "## 📝 Spelling check summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.push.outputs.pushed }}" = "1" ]; then
            echo "🔧 Fixed spelling issues and pushed changes as **Nexoroid[bot]**." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ No fixes pushed. Either no issues were found or this is a fork PR (report-only mode)." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Notes" >> "$GITHUB_STEP_SUMMARY"
          echo "- Supports both **UK** and **US** spellings via \`.github/codespell-ignore.txt\`." >> "$GITHUB_STEP_SUMMARY"
          echo "- Ignores common false positives: \`crate\`, \`nd\`, \`referer\`." >> "$GITHUB_STEP_SUMMARY"
          echo "- Skips build artefacts: \`node_modules\`, \`dist\`, \`.git\`." >> "$GITHUB_STEP_SUMMARY"
