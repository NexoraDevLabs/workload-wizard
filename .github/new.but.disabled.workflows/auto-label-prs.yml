name: Auto label PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: auto-label-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ensure-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Nexoroid app credentials
        id: resolve
        env:
          RESOLVED_APP_ID: ${{ secrets.APP_ID || secrets.NEXOROID_APP_ID }}
          RESOLVED_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY || secrets.NEXOROID_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${RESOLVED_APP_ID}" ] || [ -z "${RESOLVED_PRIVATE_KEY}" ]; then
            echo "Missing Nexoroid App credentials."
            exit 1
          fi
          echo "::add-mask::${RESOLVED_PRIVATE_KEY}"
          {
            echo "app_id=${RESOLVED_APP_ID}"
            echo "private_key<<EOF"
            echo "${RESOLVED_PRIVATE_KEY}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Get Nexoroid app token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2
        with:
          app-id: ${{ steps.resolve.outputs.app_id }}
          private-key: ${{ steps.resolve.outputs.private_key }}
          owner: ${{ github.repository_owner }}

      - name: Create labels if missing
        id: ensure
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const wanted = [
              // Core types you already use
              { name:'bug',              color:'d73a4a', description:'Something is not working' },
              { name:'chore',            color:'cfd3d7', description:'Maintenance / refactors / upgrades' },
              { name:'ci',               color:'cfd3d7', description:'CI / workflows' },
              { name:'critical',         color:'b60205', description:'Blocking production or urgent fix' },
              { name:'dependencies',     color:'0e8a16', description:'Package/security updates' },
              { name:'design',           color:'5319e7', description:'UI/UX, visuals, assets' },
              { name:'discussion',       color:'6f42c1', description:'Needs team/community input' },
              { name:'documentation',    color:'0075ca', description:'Docs changes' },
              { name:'duplicate',        color:'cccccc', description:'Already reported' },
              { name:'enhancement',      color:'a2eeef', description:'New feature or request' },
              { name:'feature',          color:'a2eeef', description:'New functionality' },
              { name:'good first issue', color:'7057ff', description:'Simple issue for new contributors' },
              { name:'help wanted',      color:'008672', description:'Maintainers need support' },
              { name:'infra',            color:'1d76db', description:'Infrastructure / hosting / config' },
              { name:'performance',      color:'fbca04', description:'Optimisation and efficiency' },
              { name:'priority: high',   color:'b60205', description:'Needs immediate attention' },
              { name:'priority: low',    color:'e4e669', description:'Nice-to-have' },
              { name:'priority: medium', color:'d4c5f9', description:'Normal flow' },
              { name:'refactor',         color:'0bb4a6', description:'Restructure without functional change' },
              { name:'security',         color:'b60205', description:'Security-related issues' },
              { name:'status: blocked',  color:'d876e3', description:'Cannot proceed until dependency is resolved' },
              { name:'status: done',     color:'0e8a16', description:'Completed / merged' },
              { name:'status: in progress', color:'c2e0c6', description:'Being worked on' },
              { name:'status: review',   color:'f9d0c4', description:'Awaiting review' },
              { name:'status: todo',     color:'5319e7', description:'Ready to pick up' },
              { name:'test',             color:'f9d0c4', description:'Testing and QA' },
              { name:'wontfix',          color:'ffffff', description:'Will not be resolved' },
              // App areas
              { name:'app:api',          color:'0366d6', description:'Backend / API' },
              { name:'app:web',          color:'0e8a16', description:'Web front-end' },
              // Optional size labels
              { name:'size:XS',          color:'ededed', description:'<= 10 lines changed' },
              { name:'size:S',           color:'c2e0c6', description:'<= 50 lines changed' },
              { name:'size:M',           color:'a8d1ff', description:'<= 200 lines changed' },
              { name:'size:L',           color:'fef2c0', description:'<= 500 lines changed' },
              { name:'size:XL',          color:'f9d0c4', description:'> 500 lines changed' }
            ];
            const created = [];
            const ensured = [];
            for (const l of wanted) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: l.name });
                ensured.push(l.name);
              } catch {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: l.name, color: l.color, description: l.description });
                created.push(l.name);
              }
            }
            core.setOutput('created', created.join(','));
            core.setOutput('ensured', ensured.join(','));
            core.setOutput('total', String(wanted.length));

      - name: Write job summary (ensure labels)
        if: ${{ always() }}
        env:
          CREATED: ${{ steps.ensure.outputs.created }}
          ENSURED: ${{ steps.ensure.outputs.ensured }}
          TOTAL: ${{ steps.ensure.outputs.total }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Auto Label PRs – Labels Ensured"
            echo ""
            echo "- Repository: ${REPO}"
            echo "- Total label definitions: ${TOTAL:-0}"
            echo "- Created now: ${CREATED:-none}"
            echo "- Already present: ${ENSURED:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

  by-path:
    runs-on: ubuntu-latest
    needs: ensure-labels
    steps:
      - name: Resolve Nexoroid app credentials
        id: resolve
        env:
          RESOLVED_APP_ID: ${{ secrets.APP_ID || secrets.NEXOROID_APP_ID }}
          RESOLVED_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY || secrets.NEXOROID_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${RESOLVED_APP_ID}" ] || [ -z "${RESOLVED_PRIVATE_KEY}" ]; then
            echo "Missing Nexoroid App credentials."
            exit 1
          fi
          echo "::add-mask::${RESOLVED_PRIVATE_KEY}"
          {
            echo "app_id=${RESOLVED_APP_ID}"
            echo "private_key<<EOF"
            echo "${RESOLVED_PRIVATE_KEY}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Get Nexoroid app token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2
        with:
          app-id: ${{ steps.resolve.outputs.app_id }}
          private-key: ${{ steps.resolve.outputs.private_key }}
          owner: ${{ github.repository_owner }}

      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
        with:
          repo-token: ${{ steps.app-token.outputs.token }}

      - name: Summarise labels after path rules
        if: ${{ always() }}
        id: path-summary
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const number = context.payload.pull_request.number;
            const labels = (await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: number
            })).data.map(l => l.name);
            core.setOutput('labels', labels.join(','));

      - name: Write job summary (path rules)
        if: ${{ always() }}
        env:
          LABELS: ${{ steps.path-summary.outputs.labels }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HTML_URL: ${{ github.event.pull_request.html_url }}
        run: |
          {
            echo "## Auto Label PRs – Path Rules"
            echo ""
            echo "- PR: #${PR_NUMBER} (${PR_HTML_URL})"
            echo "- Current labels on PR (after path rules): ${LABELS:-none}"
            echo ""
            echo "Configured via .github/labeler.yml"
          } >> "$GITHUB_STEP_SUMMARY"

  size-label:
    runs-on: ubuntu-latest
    needs: ensure-labels
    steps:
      - name: Resolve Nexoroid app credentials
        id: resolve
        env:
          RESOLVED_APP_ID: ${{ secrets.APP_ID || secrets.NEXOROID_APP_ID }}
          RESOLVED_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY || secrets.NEXOROID_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${RESOLVED_APP_ID}" ] || [ -z "${RESOLVED_PRIVATE_KEY}" ]; then
            echo "Missing Nexoroid App credentials."
            exit 1
          fi
          echo "::add-mask::${RESOLVED_PRIVATE_KEY}"
          {
            echo "app_id=${RESOLVED_APP_ID}"
            echo "private_key<<EOF"
            echo "${RESOLVED_PRIVATE_KEY}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Get Nexoroid app token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2
        with:
          app-id: ${{ steps.resolve.outputs.app_id }}
          private-key: ${{ steps.resolve.outputs.private_key }}
          owner: ${{ github.repository_owner }}

      - name: Apply size label
        id: size
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const number = context.payload.pull_request.number;
            const pr = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: number });
            const changed = (pr.data.additions || 0) + (pr.data.deletions || 0);
            const pick = (n) => n<=10?'size:XS' : n<=50?'size:S' : n<=200?'size:M' : n<=500?'size:L' : 'size:XL';
            const label = pick(changed);
            const existing = (await github.rest.issues.listLabelsOnIssue({ owner: context.repo.owner, repo: context.repo.repo, issue_number: number })).data.map(l=>l.name);
            const toRemove = existing.filter(n => n.startsWith('size:') && n !== label);
            for (const n of toRemove) {
              await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: number, name: n }).catch(()=>{});
            }
            if (!existing.includes(label)) {
              await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: number, labels: [label] });
            }
            core.setOutput('label', label);
            core.setOutput('changed', String(changed));

      - name: Write job summary (size)
        if: ${{ always() }}
        env:
          LABEL: ${{ steps.size.outputs.label }}
          CHANGED: ${{ steps.size.outputs.changed }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HTML_URL: ${{ github.event.pull_request.html_url }}
        run: |
          {
            echo "## Auto Label PRs – Size"
            echo ""
            echo "- PR: #${PR_NUMBER} (${PR_HTML_URL})"
            echo "- Lines changed (additions + deletions): ${CHANGED:-0}"
            echo "- Applied size label: ${LABEL:-none}"
            echo ""
            echo "Thresholds: XS <=10, S <=50, M <=200, L <=500, XL >500"
          } >> "$GITHUB_STEP_SUMMARY"

  by-branch:
    runs-on: ubuntu-latest
    needs: ensure-labels
    steps:
      - name: Resolve Nexoroid app credentials
        id: resolve
        env:
          RESOLVED_APP_ID: ${{ secrets.APP_ID || secrets.NEXOROID_APP_ID }}
          RESOLVED_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY || secrets.NEXOROID_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${RESOLVED_APP_ID}" ] || [ -z "${RESOLVED_PRIVATE_KEY}" ]; then
            echo "Missing Nexoroid App credentials."
            exit 1
          fi
          echo "::add-mask::${RESOLVED_PRIVATE_KEY}"
          {
            echo "app_id=${RESOLVED_APP_ID}"
            echo "private_key<<EOF"
            echo "${RESOLVED_PRIVATE_KEY}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Get Nexoroid app token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2
        with:
          app-id: ${{ steps.resolve.outputs.app_id }}
          private-key: ${{ steps.resolve.outputs.private_key }}
          owner: ${{ github.repository_owner }}

      - name: Map branch names to labels
        id: branch-map
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const branch = context.payload.pull_request.head.ref;
            const maps = [
              { re: /^(feat|feature)\//i, label: 'enhancement' },
              { re: /^fix\//i,            label: 'bug' },
              { re: /^chore\//i,          label: 'chore' },
              { re: /^ci\//i,             label: 'ci' },
              { re: /^docs?\//i,          label: 'documentation' },
              { re: /^perf\//i,           label: 'performance' },
              { re: /^refactor\//i,       label: 'refactor' },
              { re: /^test\//i,           label: 'test' }
            ];
            const toAdd = maps.filter(m => m.re.test(branch)).map(m => m.label);
            if (toAdd.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: toAdd
              });
            }
            core.setOutput('branch', branch);
            core.setOutput('labels', toAdd.join(','));

      - name: Write job summary (branch)
        if: ${{ always() }}
        env:
          BRANCH: ${{ steps.branch-map.outputs.branch }}
          LABELS: ${{ steps.branch-map.outputs.labels }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HTML_URL: ${{ github.event.pull_request.html_url }}
        run: |
          {
            echo "## Auto Label PRs – Branch Rules"
            echo ""
            echo "- PR: #${PR_NUMBER} (${PR_HTML_URL})"
            echo "- Branch: ${BRANCH:-unknown}"
            echo "- Labels applied from branch name: ${LABELS:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
