name: PR title & label guard

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ensure-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Nexoroid app credentials
        id: resolve
        env:
          RESOLVED_APP_ID: ${{ secrets.NEXOROID_APP_ID }}
          RESOLVED_PRIVATE_KEY: ${{ secrets.NEXOROID_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${RESOLVED_APP_ID}" ] || [ -z "${RESOLVED_PRIVATE_KEY}" ]; then
            echo "Missing Nexoroid App credentials. Set repo secrets NEXOROID_APP_ID and NEXOROID_APP_PRIVATE_KEY."
            exit 1
          fi
          echo "::add-mask::${RESOLVED_PRIVATE_KEY}"
          {
            echo "app_id=${RESOLVED_APP_ID}"
            echo "private_key<<EOF"
            echo "${RESOLVED_PRIVATE_KEY}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Get Nexoroid app token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2
        with:
          app-id: ${{ steps.resolve.outputs.app_id }}
          private-key: ${{ steps.resolve.outputs.private_key }}
          owner: ${{ github.repository_owner }}

      - name: Ensure required labels exist
        id: ensure
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const wanted = [
              {name:'breaking-change', color:'d73a4a', desc:'Breaking change'},
              {name:'enhancement',     color:'a2eeef', desc:'Feature / enhancement'},
              {name:'bug',             color:'d73a4a', desc:'Bug fix'},
              {name:'docs',            color:'0075ca', desc:'Documentation'},
              {name:'chore',           color:'cfd3d7', desc:'Maintenance'},
              {name:'refactor',        color:'cfd3d7', desc:'Refactor'},
              {name:'ci',              color:'cfd3d7', desc:'CI'},
              {name:'build',           color:'cfd3d7', desc:'Build'},
              {name:'test',            color:'f9d0c4', desc:'Tests'},
              {name:'regression',      color:'d73a4a', desc:'Regression'},
              {name:'documentation',   color:'0075ca', desc:'Documentation (alias)'},
              {name:'Meta: Exclude From Changelog', color:'ededed', desc:'Exclude from changelog'}
            ];
            const ensured = [];
            const created = [];
            for (const l of wanted) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: l.name });
                ensured.push(l.name);
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: l.name,
                  color: l.color,
                  description: l.desc
                });
                created.push(l.name);
              }
            }
            core.setOutput('ensured', ensured.join(','));
            core.setOutput('created', created.join(','));
            core.setOutput('total', String(wanted.length));

      - name: Write job summary (labels)
        if: ${{ always() }}
        env:
          TOTAL: ${{ steps.ensure.outputs.total }}
          ENSURED: ${{ steps.ensure.outputs.ensured }}
          CREATED: ${{ steps.ensure.outputs.created }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## 🏷️ PR Label Guard – labels ensured"
            echo ""
            echo "- **Repository:** ${REPO}"
            echo "- **Total required labels:** ${TOTAL:-0}"
            echo "- **Created now:** ${CREATED:-none}"
            echo "- **Already present:** ${ENSURED:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

  check-title-and-label:
    runs-on: ubuntu-latest
    needs: ensure-labels
    steps:
      - name: Resolve Nexoroid app credentials
        id: resolve
        env:
          RESOLVED_APP_ID: ${{ secrets.NEXOROID_APP_ID }}
          RESOLVED_PRIVATE_KEY: ${{ secrets.NEXOROID_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${RESOLVED_APP_ID}" ] || [ -z "${RESOLVED_PRIVATE_KEY}" ]; then
            echo "Missing Nexoroid App credentials. Set repo secrets NEXOROID_APP_ID and NEXOROID_APP_PRIVATE_KEY."
            exit 1
          fi
          echo "::add-mask::${RESOLVED_PRIVATE_KEY}"
          {
            echo "app_id=${RESOLVED_APP_ID}"
            echo "private_key<<EOF"
            echo "${RESOLVED_PRIVATE_KEY}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Get Nexoroid app token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2
        with:
          app-id: ${{ steps.resolve.outputs.app_id }}
          private-key: ${{ steps.resolve.outputs.private_key }}
          owner: ${{ github.repository_owner }}

      - name: Validate PR title & apply labels
        id: guard
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const pr = context.payload.pull_request;
            const title = (pr?.title || '').trim();

            // Conventional types accepted
            const re = /^(revert:\s*)?(feat|fix|docs|style|refactor|perf|test|build|ci|chore|security|revert)(\([\w\-., ]+\))?:\s.+/i;
            const ok = re.test(title);

            // Map type -> labels
            const type = (title.match(/^(?:revert:\s*)?(\w+)/i)||[])[1]?.toLowerCase();
            const map = {
              feat:        ['enhancement'],
              fix:         ['bug'],
              docs:        ['docs'],
              chore:       ['chore'],
              refactor:    ['refactor','chore'],
              build:       ['build','chore'],
              ci:          ['ci','chore'],
              test:        ['test'],
              perf:        ['enhancement'],
              security:    ['security','bug'],
              revert:      ['chore']
            };
            const labels = map[type] || [];

            // Try to add labels (idempotent)
            if (labels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, labels
              });
            }

            // Outputs for summary
            core.setOutput('ok', ok ? 'true' : 'false');
            core.setOutput('title', title);
            core.setOutput('type', type || '');
            core.setOutput('labels', labels.join(','));

            if (!ok) {
              core.setFailed(`PR title must follow Conventional Commits. Example: "feat(api): add bulk upload". Got: "${title}"`);
            }

      - name: Write job summary (PR guard)
        if: ${{ always() }}
        env:
          OK: ${{ steps.guard.outputs.ok }}
          TITLE: ${{ steps.guard.outputs.title }}
          TYPE: ${{ steps.guard.outputs.type }}
          LABELS: ${{ steps.guard.outputs.labels }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HTML_URL: ${{ github.event.pull_request.html_url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## 🔒 PR Title & Label Guard"
            echo ""
            echo "- **PR:** [#${PR_NUMBER}](${PR_HTML_URL})"
            echo "- **Status:** \`${JOB_STATUS:-unknown}\`"
            echo "- **Title:** ${TITLE:-'(none)'}"
            if [ "${OK}" = "true" ]; then
              echo "- **Conventional Commits:** ✅ Passed"
            else
              echo "- **Conventional Commits:** ❌ Failed"
              echo "  - Format: \`<type>(optional scope): <summary>\`"
              echo "  - Example: \`feat(api): add bulk upload\`"
            fi
            echo "- **Detected type:** \`${TYPE:-unknown}\`"
            echo "- **Labels applied (by type):** \`${LABELS:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"
