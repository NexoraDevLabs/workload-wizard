name: PR Checks Summary

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]
  workflow_run:
    workflows: ['Quality', 'E2E', 'Semgrep', 'CodeQL', 'Deploy to Vercel']
    types: [completed]

permissions:
  pull-requests: write
  checks: read
  actions: read
  contents: read

jobs:
  summarize:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        id: build-summary
        with:
          script: |
            const pr = context.payload.pull_request
              ? context.payload.pull_request
              : (await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.workflow_run.pull_requests?.[0]?.number
                })).data;

            const sha = pr.head.sha;

            // Fetch latest check runs for this SHA
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha
            });

            // Fetch workflow runs (useful for conclusion + url)
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
              head_sha: sha
            });

            const pickUrl = (name) => {
              const run = runs.data.workflow_runs.find(r => r.name === name);
              return run?.html_url || null;
            };

            const rows = checks.data.check_runs.map(cr => {
              const icon = cr.conclusion === "success" ? "✅"
                : cr.conclusion === "failure" ? "❌"
                : cr.status !== "completed" ? "⏳" : "⚠️";
              const url = cr.html_url || pickUrl(cr.name);
              return `| ${icon} | ${cr.name} | ${cr.status}/${cr.conclusion ?? "-"} | [logs](${url ?? cr.html_url}) |`;
            });

            const body = [
              `### CI status for \`${sha.slice(0,7)}\``,
              "",
              "|  | Check | Status | Link |",
              "|-:|:------|:------:|:-----|",
              ...(rows.length ? rows : ["| ℹ️ | No checks yet | - | - |"]),
              "",
              "_This table updates as checks finish._"
            ].join("\n");

            return { body, prNumber: pr.number };
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ fromJson(steps.build-summary.outputs.result).prNumber }}
          message: ${{ fromJson(steps.build-summary.outputs.result).body }}
