name: PR Summary (Checks)

on:
  pull_request:
    types:
      [
        opened,
        edited,
        synchronize,
        ready_for_review,
        reopened,
        labeled,
        unlabeled,
      ]
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: pr-summary-${{ github.workflow }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  pr_summary:
    name: Generate PR Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Fork safety: only run on same-repo PRs
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: PR Summary
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = pr.head.sha;
            const prNumber = pr.number;

            const [commitsResp, filesResp, labelsResp] = await Promise.all([
              github.rest.pulls.listCommits({ owner, repo, pull_number: prNumber, per_page: 250 }),
              github.rest.pulls.listFiles({ owner, repo, pull_number: prNumber, per_page: 300 }),
              github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number: prNumber, per_page: 100 })
            ]);

            const commits = commitsResp.data || [];
            const files = filesResp.data || [];
            const labels = (labelsResp.data || []).map(l => l.name).sort();

            const areas = {
              ui: files.filter(f => /^(app|components|styles|public)\//.test(f.filename)),
              api: files.filter(f => /^app\/api\/|^src\/server\/|^convex\//.test(f.filename)),
              ci: files.filter(f => /^\.github\/workflows\//.test(f.filename)),
              tests: files.filter(f => /(\btest|\.spec|\.e2e)\./.test(f.filename) || /^tests?\//.test(f.filename))
            };

            const linkRegex = /(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#(\d+)/ig;
            const sources = [pr.title || '', pr.body || '', ...(commits.map(c => (c.commit?.message)||''))].join('\n');
            const linked = new Set();
            let m; while ((m = linkRegex.exec(sources)) !== null) linked.add(m[3]);
            const linkedIssues = [...linked].map(n => `#${n}`).join(' ');

            const commitLines = commits.slice(-15).map(c => {
              const msg = (c.commit?.message||'').split('\n')[0];
              return `- \`${c.sha.substring(0,7)}\` ${msg}`;
            }).join('\n');

            const changedSummary = files.reduce((acc, f) => {
              acc.total += 1;
              acc.additions += f.additions || 0;
              acc.deletions += f.deletions || 0;
              if (f.status === 'added') acc.added++;
              if (f.status === 'removed') acc.removed++;
              if (['modified','renamed'].includes(f.status)) acc.modified++;
              return acc;
            }, { total:0, added:0, removed:0, modified:0, additions:0, deletions:0 });

            // Build summary markdown
            const mdParts = [
              `### ✨ PR Summary: #${pr.number} — ${pr.title || ''}`,
              '',
              `**Author:** @${pr.user.login}`,
              `**Base:** \`${pr.base.ref}\` ← **Head:** \`${pr.head.ref}\``,
              `**State:** ${pr.draft ? '📝 Draft' : '✅ Ready'}`,
              `**Labels:** ${labels.length ? labels.map(l => '`'+l+'`').join(' ') : '_none_'}`,
              `**Linked issues:** ${linkedIssues || '_none_'}`,
              '',
              '---',
              '',
              '#### 📦 Changes',
              `- Files: **${changedSummary.total}** (➕ ${changedSummary.additions} / ➖ ${changedSummary.deletions})`,
              `- Added: **${changedSummary.added}**, Modified/Renamed: **${changedSummary.modified}**, Removed: **${changedSummary.removed}**`,
              '',
              '**Areas touched**',
              `- UI: **${areas.ui.length}**`,
              `- API/Data: **${areas.api.length}**`,
              `- CI: **${areas.ci.length}**`,
              `- Tests: **${areas.tests.length}**`,
              '',
              '<details>',
              '<summary>Changed files (top 50)</summary>',
              '',
              files.slice(0,50).map(f => `- ${f.status.toUpperCase()} \`${f.filename}\` (${f.additions}+/${f.deletions}-)`).join('\n'),
              '',
              '</details>',
              '',
              '---',
              '',
              `#### 🧾 Recent commits (last ${Math.min(commits.length, 15)})`,
              commitLines || '_no commits?_'
            ];

            // Checks API has size limits; trim if oversized (~60k)
            const mdRaw = mdParts.join('\n');
            const md = mdRaw.length > 60000 ? mdRaw.slice(0, 59000) + '\n\n_…truncated…_' : mdRaw;

            const checkName = 'PR Summary';
            const existing = await github.rest.checks.listForRef({ owner, repo, ref: sha, check_name: checkName });
            if (existing.data.check_runs.length > 0) {
              await github.rest.checks.update({
                owner, repo, check_run_id: existing.data.check_runs[0].id,
                status: 'completed', conclusion: 'neutral',
                completed_at: new Date().toISOString(),
                output: { title: `PR Summary #${pr.number}`, summary: md, text: md }
              });
            } else {
              await github.rest.checks.create({
                owner, repo, name: checkName, head_sha: sha,
                status: 'completed', conclusion: 'neutral',
                completed_at: new Date().toISOString(),
                output: { title: `PR Summary #${pr.number}`, summary: md, text: md }
              });
            }
