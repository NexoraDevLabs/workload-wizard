name: Weekly Dependency Audit

on:
  schedule:
    - cron: '0 8 * * 1' # Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Detect pnpm
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "mgr=pnpm" >> "$GITHUB_OUTPUT"; else echo "mgr=npm" >> "$GITHUB_OUTPUT"; fi
      - if: steps.pm.outputs.mgr == 'pnpm'
        uses: pnpm/action-setup@v4
        with: { version: 9 }
      - name: Install (frozen)
        run: |
          if [ "${{ steps.pm.outputs.mgr }}" = "pnpm" ]; then pnpm i --frozen-lockfile; else npm ci; fi
      - name: Audit
        run: |
          if [ "${{ steps.pm.outputs.mgr }}" = "pnpm" ]; then
            pnpm audit --audit-level=high
          else
            npm audit --omit=dev --audit-level=high
          fi
