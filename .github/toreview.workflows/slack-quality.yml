name: Slack - Quality notifications

on:
  workflow_run:
    workflows: ['Quality']
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  notify:
    name: Notify Slack (Quality)
    runs-on: ubuntu-latest
    # Only for dev/main branches
    if: |
      github.event.workflow_run.head_branch == 'dev' ||
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Build message JSON
        id: msg
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          NAME: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: |
          set -e
          if [ "$CONCLUSION" = "success" ]; then
            ICON="✅"; COLOR="#2eb886"
          elif [ "$CONCLUSION" = "failure" ] || [ "$CONCLUSION" = "cancelled" ] || [ "$CONCLUSION" = "timed_out" ]; then
            ICON="❌"; COLOR="#e01e5a"
          else
            ICON="⚠️"; COLOR="#e3b341"
          fi

          TEXT="$ICON *Quality* run on \`$BRANCH\` — \`$(echo $SHA | cut -c1-7)\` → *$CONCLUSION*"
          printf 'payload=%s\n' "$(jq -n --arg ch "${{ secrets.SLACK_CHANNEL_ID }}" \
            --arg text "$TEXT" \
            --arg run "$RUN_URL" --arg actor "$ACTOR" --arg color "$COLOR" '
            {
              channel: $ch,
              text: $text,
              attachments: [
                {
                  color: $color,
                  blocks: [
                    { "type": "section", "text": { "type": "mrkdwn", "text": $text } },
                    { "type": "context", "elements": [
                        { "type": "mrkdwn", "text": "*Triggered by:* @" + $actor },
                        { "type": "mrkdwn", "text": "<" + $run + "|View run>" }
                    ]}
                  ]
                }
              ]
            }')" >> $GITHUB_OUTPUT

      # Notify: failures for PRs; always for pushes to main/dev
      - name: Send Slack (Quality)
        if: |
          github.event.workflow_run.event == 'push' ||
          github.event.workflow_run.conclusion != 'success'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        uses: abinoda/slack-action@master
        with:
          # chat.postMessage payload as JSON
          args: ${{ steps.msg.outputs.payload }}
