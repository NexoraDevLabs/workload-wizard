name: Semgrep

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Job Summary
        if: ${{ always() }}
        run: |
          {
            echo "## ✅ Semgrep scan completed"
            echo ""
            echo "- Workflow: **${{ github.workflow }}**"
            echo "- Ref: **${{ github.ref_name }}** (${GITHUB_SHA:0:7})"
            echo "- Runner: **${{ runner.os }}**"
            echo ""
            echo "### Scan Details"
            echo "- Ruleset: **p/ci (OWASP + Semgrep community rules)**"
            echo "- Output: **SARIF format**"
            echo "- Status: **${{ job.status }}**"
            echo ""
            echo "### Results"
            echo "Results uploaded to **Security → Code scanning alerts**"
          } >> "$GITHUB_STEP_SUMMARY"
