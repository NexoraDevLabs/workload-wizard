name: Semgrep

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    - cron: "12 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

jobs:
  gh_status:
    name: GitHub status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: read
    steps:
      - uses: crazy-max/ghaction-github-status@v4.2.0
        with:
          overall_threshold: minor
          actions_threshold: degraded_performance
          api_threshold: degraded_performance

  semgrep:
    name: semgrep/ci
    needs: gh_status
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write

    steps:
      - name: Queue (per branch)
        uses: ahmadnassri/action-workflow-queue@v1
        with:
          timeout: 30m

      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Paths filter
        id: changes
        uses: dorny/paths-filter@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: .github/filters.yml

      - name: Skip Semgrep (no relevant changes)
        if: ${{ steps.changes.outputs.sec != 'true' && steps.changes.outputs.app != 'true' && steps.changes.outputs.ci != 'true' }}
        run: echo "No security-relevant changes; skipping." && exit 0

      # Trusted PRs and pushes → full run (publish + SARIF)
      - name: Run Semgrep CI (trusted - publish + SARIF)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: returntocorp/semgrep-action@v1
        with:
          publishToken: ${{ env.SEMGREP_APP_TOKEN }}
          generateSarif: "1"
          config: p/ci
        env:
          SEMGREP_APP_TOKEN: ${{ env.SEMGREP_APP_TOKEN }}

      # Fork PRs → analysis only, no uploads
      - name: Run Semgrep (fork PR - analysis only)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: returntocorp/semgrep-action@v1
        with:
          generateSarif: "1"
          config: p/ci

      - name: Detect Code Scanning status
        id: codescan_enabled
        uses: actions/github-script@v7
        with:
          script: |
            const res = await github.request('GET /repos/{owner}/{repo}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              headers: { 'X-GitHub-Api-Version': '2022-11-28' }
            });
            const s = res.data.security_and_analysis?.code_scanning?.status;
            core.setOutput('enabled', String(s === 'enabled'));

      - name: Upload SARIF to Code Scanning
        if: ${{ steps.codescan_enabled.outputs.enabled == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Skip SARIF upload (Code scanning disabled)
        if: ${{ steps.codescan_enabled.outputs.enabled != 'true' }}
        run: echo "Skipping SARIF upload - Code scanning is disabled in repo settings."
      - name: Job summary
        if: always()
        run: |
          echo "## Semgrep summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rule set: OWASP + ci defaults" >> "$GITHUB_STEP_SUMMARY"
          echo "- SARIF uploaded to **Security → Code scanning alerts**" >> "$GITHUB_STEP_SUMMARY"

  cleanup_artifacts:
    name: Artifact janitor
    needs: semgrep
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Remove old artifacts (keep latest 10 and all tag builds)
        uses: c-hive/gha-remove-artifacts@v1.4.0
        with:
          age: "14 days"
          skip-recent: 10
          skip-tags: true
