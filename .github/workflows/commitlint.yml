name: Commitlint

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "README*"
      - "public/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: commitlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint PR commits (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for PR commits)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commitlint
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs
          failOnWarnings: false
          failOnErrors: false
          commitDepth: 1
