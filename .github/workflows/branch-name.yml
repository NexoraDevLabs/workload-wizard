name: Branch Name Guard

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "README*"
      - "public/**"

permissions:
  contents: read
  pull-requests: write # needed for the action to comment on the PR

concurrency:
  group: branch-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Enforce feat/* or fix/* (and test/*)
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        uses: deepakputhraya/action-branch-name@v1.0.0
        with:
          # allow: feat/<slug> | fix/<slug> | test/<slug>
          allowed_prefixes: "feat,fix,test"
          # branches to ignore completely (exact matches or regexes)
          ignore: "main,dev,dependabot,renovate"
          min_length: 5
          max_length: 100
