name: GitHub Service Health Gate

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: gh-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status:
    name: Check GitHub Status
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub Status (fail if degraded)
        uses: crazy-max/ghaction-github-status@v4.2.0
        with:
          # If overall status is >= minor incident, fail fast
          overall_threshold: minor
          # Be strict on CI-critical components
          actions_threshold: degraded_performance
          api_threshold: degraded_performance
          pages_threshold: partial_outage
