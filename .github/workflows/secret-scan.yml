name: Secret scan

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # daily at 04:00 UTC

permissions:
  contents: read
  pull-requests: write  # PR comments when permitted by the event

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks scan
    runs-on: ubuntu-latest

    steps:
      # Decide auth mode:
      # - PR events: we'll use Docker CLI (no token needed for scan)
      # - Non-PR events: try App token; if secrets missing, fall back to GITHUB_TOKEN
      - name: Decide authentication
        id: auth
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          APP_ID: ${{ secrets.NEXOROID_APP_ID }}
          APP_KEY: ${{ secrets.NEXOROID_APP_PRIVATE_KEY }}
          GH_DEFAULT: ${{ github.token }}
        run: |
          set -euo pipefail
          MODE="gh"
          if [ "${IS_PR}" != "true" ]; then
            if [ -n "${APP_ID}" ] && [ -n "${APP_KEY}" ]; then
              MODE="app"
            fi
          fi
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          # expose default token for fallback consumers
          echo "gh_token=${GH_DEFAULT}" >> "$GITHUB_OUTPUT"

      # Mint App token only if we chose app mode
      - name: Get Nexoroid app token
        if: ${{ steps.auth.outputs.mode == 'app' }}
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2
        with:
          app-id: ${{ secrets.NEXOROID_APP_ID }}
          private-key: ${{ secrets.NEXOROID_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Checkout safely
      - name: Checkout PR head (supports forks)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout (full history)
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || steps.auth.outputs.gh_token }}

      # Compute whether PR comments are allowed
      - name: Compute comment settings
        id: commentable
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
              echo "enable=true"  >> "$GITHUB_OUTPUT"
            else
              echo "enable=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "enable=true"    >> "$GITHUB_OUTPUT"
          fi

      # Run Gitleaks:
      # - PRs: Docker CLI (robust for forks / avoids PR_TARGET limitations)
      - name: Run Gitleaks (PR via Docker)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          REPORT="gitleaks.sarif"
          CFG=""
          if [ -f ".github/gitleaks.toml" ]; then
            CFG="--config .github/gitleaks.toml"
          fi
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            detect --no-git --source /repo $CFG \
            --report-format sarif --report-path "$REPORT" --redact --exit-code 1

      # - Non-PR events: official action with App token if available, else GH token
      - name: Run Gitleaks (action on non-PR)
        if: ${{ github.event_name != 'pull_request' }}
        id: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || steps.auth.outputs.gh_token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # GITLEAKS_CONFIG: .github/gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: ${{ steps.commentable.outputs.enable }}
          GITLEAKS_ENABLE_SUMMARY: true

      # Job summary
      - name: Write job summary
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HTML_URL: ${{ github.event.pull_request.html_url }}
          COMMENTS: ${{ steps.commentable.outputs.enable }}
          MODE: ${{ steps.auth.outputs.mode }}
        run: |
          COMMIT_URL="https://github.com/${REPO}/commit/${SHA}"
          SECURITY_TAB="https://github.com/${REPO}/security/code-scanning"
          {
            echo "## Secret scan (Gitleaks)"
            echo ""
            echo "- Status: \`${JOB_STATUS:-unknown}\`"
            echo "- Event: \`${EVENT_NAME:-unknown}\`"
            [ -n "${PR_NUMBER}" ] && echo "- PR: [#${PR_NUMBER}](${PR_HTML_URL})"
            echo "- Auth mode: \`${MODE}\` (app=App token, gh=GITHUB_TOKEN)"
            echo "- PR comments enabled: \`${COMMENTS:-false}\`"
            echo "- Commit: ${COMMIT_URL}"
            echo ""
            echo "### Notes"
            echo "- PRs run via Docker CLI to avoid event limitations."
            echo "- Non-PR events use the official action with App identity when available."
            echo ""
            echo "### Quick links"
            echo "- Security tab (Code scanning): ${SECURITY_TAB}"
          } >> "$GITHUB_STEP_SUMMARY"
