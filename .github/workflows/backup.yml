name: Nightly DR Backup to R2

on:
  schedule:
    # 02:00 Europe/London (01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      force_upload:
        description: 'Force upload even if content hash matches'
        required: false
        default: false
        type: boolean

env:
  TZ: Europe/London

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zstd python3-pip
          pip3 install awscli

      - name: Install Convex CLI
        run: npm install -g convex

      - name: Create backup directory
        run: mkdir -p backup

      - name: Export Convex data
        run: |
          convex export --prod --output backup/convex_snapshot.zip
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}

      - name: Fetch Vercel environment variables
        run: |
          curl -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v10/projects/${{ secrets.VERCEL_PROJECT }}/env" \
            | jq -c '.' > backup/vercel/env.json

      - name: Fetch Clerk users (minimal fields)
        run: |
          # Fetch all users with pagination, keeping only essential fields
          page=0
          limit=500
          all_users="[]"

          while true; do
            offset=$((page * limit))
            echo "Fetching page $page (offset $offset)..."
            
            response=$(curl -s -H "Authorization: Bearer ${{ secrets.CLERK_SECRET_KEY }}" \
              "https://api.clerk.dev/v1/users?limit=$limit&offset=$offset")
            
            users=$(echo "$response" | jq -c '.data // []')
            count=$(echo "$users" | jq 'length')
            
            if [ "$count" -eq 0 ]; then
              break
            fi
            
            # Process users to keep only essential fields
            processed=$(echo "$users" | jq -c '[.[] | {
              id, external_id, created_at, last_active_at, banned, locked,
              email_addresses: (.email_addresses // [] | map({email_address}))
            }]')
            
            all_users=$(echo "$all_users $processed" | jq -c '.[0] + .[1]')
            page=$((page + 1))
            
            # Safety break to prevent infinite loops
            if [ "$page" -gt 100 ]; then
              echo "Warning: Reached maximum page limit (100)"
              break
            fi
          done

          echo "$all_users" | jq -c '.' > backup/clerk/users.min.json
          echo "Fetched $(echo "$all_users" | jq 'length') users"

      - name: Create backup manifest
        run: |
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Calculate file sizes
          convex_size=$(stat -c%s backup/convex_snapshot.zip 2>/dev/null || echo 0)
          vercel_size=$(stat -c%s backup/vercel/env.json 2>/dev/null || echo 0)
          clerk_size=$(stat -c%s backup/clerk/users.min.json 2>/dev/null || echo 0)

          cat > backup/manifest.json << EOF
          {
            "timestamp": "$timestamp",
            "source": "prod",
            "sizes": {
              "convex_zip": $convex_size,
              "vercel_env": $vercel_size,
              "clerk_users": $clerk_size
            }
          }
          EOF

      - name: Package backup with compression
        run: |
          timestamp=$(date -u +"%Y%m%dT%H%M%SZ")

          # Try zstd first, fallback to gzip
          if command -v zstd >/dev/null 2>&1; then
            echo "Using zstd compression"
            tar --zstd -cf "backup_${timestamp}.tar.zst" -C backup .
            ARCHIVE="backup_${timestamp}.tar.zst"
            COMPRESSION="zstd"
          else
            echo "Using gzip compression (zstd not available)"
            tar -czf "backup_${timestamp}.tar.gz" -C backup .
            ARCHIVE="backup_${timestamp}.tar.gz"
            COMPRESSION="gzip"
          fi

          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
          echo "COMPRESSION=$COMPRESSION" >> $GITHUB_ENV

      - name: Calculate archive hash
        run: |
          ARCHIVE_SHA256=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          echo "ARCHIVE_SHA256=$ARCHIVE_SHA256" >> $GITHUB_ENV
          echo "Archive hash: $ARCHIVE_SHA256"

      - name: Check for existing backup (deduplication)
        if: github.event.inputs.force_upload != 'true'
        run: |
          # Download latest.json from R2 to check for deduplication
          aws s3 cp "s3://${{ secrets.R2_BUCKET }}/latest.json" latest.json --endpoint-url "${{ secrets.R2_ENDPOINT }}" || echo "No previous backup found"

          if [ -f latest.json ]; then
            existing_hash=$(jq -r '.content_sha256' latest.json)
            if [ "$existing_hash" = "$ARCHIVE_SHA256" ]; then
              echo "Content hash matches existing backup, skipping upload"
              echo "SKIP_UPLOAD=true" >> $GITHUB_ENV
            else
              echo "Content hash differs, proceeding with upload"
              echo "SKIP_UPLOAD=false" >> $GITHUB_ENV
            fi
          else
            echo "No existing backup found, proceeding with upload"
            echo "SKIP_UPLOAD=false" >> $GITHUB_ENV
          fi

      - name: Upload to R2 (if needed)
        if: env.SKIP_UPLOAD != 'true'
        run: |
          echo "Uploading archive to R2..."
          aws s3 cp "$ARCHIVE" "s3://${{ secrets.R2_BUCKET }}/$ARCHIVE" --no-progress --endpoint-url "${{ secrets.R2_ENDPOINT }}"

          # Create/update latest.json
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          archive_size=$(stat -c%s "$ARCHIVE")

          cat > latest.json << EOF
          {
            "timestamp": "$timestamp",
            "archive_key": "$ARCHIVE",
            "bytes": $archive_size,
            "content_sha256": "$ARCHIVE_SHA256",
            "source": "prod",
            "compression": "$COMPRESSION"
          }
          EOF

          aws s3 cp latest.json "s3://${{ secrets.R2_BUCKET }}/latest.json" --no-progress --endpoint-url "${{ secrets.R2_ENDPOINT }}"
          echo "Uploaded $ARCHIVE ($archive_size bytes) to R2"

      - name: Create run manifest
        run: |
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [ "$SKIP_UPLOAD" = "true" ]; then
            status="unchanged"
            archive_key=""
          else
            status="uploaded"
            archive_key="$ARCHIVE"
          fi

          cat > run.json << EOF
          {
            "timestamp": "$timestamp",
            "status": "$status",
            "content_sha256": "$ARCHIVE_SHA256",
            "archive_key": "$archive_key",
            "compression": "$COMPRESSION",
            "sizes": {
              "convex_zip": $(jq -r '.sizes.convex_zip' backup/manifest.json),
              "vercel_env": $(jq -r '.sizes.vercel_env' backup/manifest.json),
              "clerk_users": $(jq -r '.sizes.clerk_users' backup/manifest.json)
            }
          }
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backup-manifest-${{ github.run_number }}
          path: |
            backup/manifest.json
            run.json
          retention-days: 14

      - name: Job Summary
        run: |
          echo "## Nightly DR Backup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ env.SKIP_UPLOAD == 'true' && 'Skipped (content unchanged)' || 'Uploaded' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Compression:** ${{ env.COMPRESSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Content Hash:** ${{ env.ARCHIVE_SHA256 }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### File Sizes" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Convex Export | $(jq -r '.sizes.convex_zip' backup/manifest.json) bytes |" >> $GITHUB_STEP_SUMMARY
          echo "| Vercel Env | $(jq -r '.sizes.vercel_env' backup/manifest.json) bytes |" >> $GITHUB_STEP_SUMMARY
          echo "| Clerk Users | $(jq -r '.sizes.clerk_users' backup/manifest.json) bytes |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$SKIP_UPLOAD" = "true" ]; then
            echo "✅ **Deduplication:** Content hash matches existing backup, no upload needed" >> $GITHUB_STEP_SUMMARY
          else
            echo "📦 **R2 Key:** ${{ env.ARCHIVE }}" >> $GITHUB_STEP_SUMMARY
            echo "📊 **Archive Size:** $(stat -c%s "$ARCHIVE") bytes" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Slack notification (on failure)
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"🚨 DR Backup failed for workload-wizard: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$SLACK_WEBHOOK"
          fi
