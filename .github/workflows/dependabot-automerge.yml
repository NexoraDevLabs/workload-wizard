name: Dependabot Automerge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: fastify/github-action-merge-dependabot@v3
        with:
          target: minor
          merge-method: squash
          # Optional label gate: add label "safe-to-merge" to allow
          # github-token not required; uses GITHUB_TOKEN
