name: CSP Header Validation

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  csp-validation:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        mode: [report-only, enforce]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set CSP mode
        run: echo "CSP_MODE=${{ matrix.mode }}" >> $GITHUB_ENV

      - name: Build application
        run: pnpm build
        env:
          CSP_MODE: ${{ matrix.mode }}
          NEXT_PUBLIC_CONVEX_URL: "https://mock-convex-url.convex.cloud"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_mock"
          CLERK_SECRET_KEY: "sk_test_mock"
          NEXT_PUBLIC_POSTHOG_KEY: "ph_mock"
          NEXT_PUBLIC_STATSIG_CLIENT_KEY: "client_mock"
          FEATFLAG_STATSIG_SERVER_API_KEY: "server_mock"

      - name: Start application in background
        run: |
          # Set required environment variables
          export NODE_ENV=production
          export PORT=3000
          export HOSTNAME=localhost
          
          # Start the server in background
          nohup pnpm start > server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          
          # Give server time to start
          sleep 15
          
          # Check if server is running
          if ps -p $SERVER_PID > /dev/null; then
            echo "✅ Server started with PID $SERVER_PID"
          else
            echo "❌ Server failed to start"
            cat server.log
            exit 1
          fi
        env:
          CSP_MODE: ${{ matrix.mode }}
          NEXT_PUBLIC_CONVEX_URL: "https://mock-convex-url.convex.cloud"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_mock"
          CLERK_SECRET_KEY: "sk_test_mock"
          NEXT_PUBLIC_POSTHOG_KEY: "ph_mock"
          NEXT_PUBLIC_STATSIG_CLIENT_KEY: "client_mock"
          FEATFLAG_STATSIG_SERVER_API_KEY: "server_mock"

      - name: Validate CSP headers
        run: |
          # Wait for server to be ready with better error handling
          echo "🔍 Waiting for server to be ready..."
          for i in {1..30}; do
            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Server is ready after ${i} seconds"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Server failed to respond after 30 seconds"
              echo "Server logs:"
              cat server.log
              echo "Checking if server process is running:"
              ps aux | grep -E "(next|node)" | grep -v grep
              echo "Checking port 3000:"
              netstat -tlnp | grep 3000 || lsof -i :3000 || true
              exit 1
            fi
            sleep 1
          done

          # Check CSP headers
          echo "🔍 Checking CSP headers for mode: ${{ matrix.mode }}"

          # Get headers
          HEADERS=$(curl -s -I http://localhost:3000)
          echo "Response headers:"
          echo "$HEADERS"

          # Check for correct CSP header based on mode
          if [ "${{ matrix.mode }}" = "enforce" ]; then
            if echo "$HEADERS" | grep -q "Content-Security-Policy:"; then
              echo "✅ Content-Security-Policy header found (enforce mode)"
            else
              echo "❌ Content-Security-Policy header missing (enforce mode)"
              exit 1
            fi
            
            if echo "$HEADERS" | grep -q "Content-Security-Policy-Report-Only:"; then
              echo "❌ Content-Security-Policy-Report-Only header found in enforce mode (should not be present)"
              exit 1
            else
              echo "✅ Content-Security-Policy-Report-Only header correctly absent (enforce mode)"
            fi
          else
            if echo "$HEADERS" | grep -q "Content-Security-Policy-Report-Only:"; then
              echo "✅ Content-Security-Policy-Report-Only header found (report-only mode)"
            else
              echo "❌ Content-Security-Policy-Report-Only header missing (report-only mode)"
              exit 1
            fi
            
            if echo "$HEADERS" | grep -q "Content-Security-Policy:"; then
              echo "❌ Content-Security-Policy header found in report-only mode (should not be present)"
              exit 1
            else
              echo "✅ Content-Security-Policy header correctly absent (report-only mode)"
            fi
          fi

          # Extract and validate CSP policy
          if [ "${{ matrix.mode }}" = "enforce" ]; then
            CSP_POLICY=$(echo "$HEADERS" | grep "Content-Security-Policy:" | cut -d: -f2- | xargs)
          else
            CSP_POLICY=$(echo "$HEADERS" | grep "Content-Security-Policy-Report-Only:" | cut -d: -f2- | xargs)
          fi

          echo "📋 CSP Policy:"
          echo "$CSP_POLICY"

          # Basic policy validation
          if [ -z "$CSP_POLICY" ]; then
            echo "❌ CSP policy is empty"
            exit 1
          fi

          # Check for required directives
          if echo "$CSP_POLICY" | grep -q "default-src"; then
            echo "✅ default-src directive found"
          else
            echo "❌ default-src directive missing"
            exit 1
          fi

          if echo "$CSP_POLICY" | grep -q "script-src"; then
            echo "✅ script-src directive found"
          else
            echo "❌ script-src directive missing"
            exit 1
          fi

          if echo "$CSP_POLICY" | grep -q "style-src"; then
            echo "✅ style-src directive found"
          else
            echo "❌ style-src directive missing"
            exit 1
          fi

          # Check for nonce in script-src and style-src
          if echo "$CSP_POLICY" | grep -q "nonce-"; then
            echo "✅ nonce found in policy"
          else
            echo "❌ nonce missing from policy"
            exit 1
          fi

          # Check for reporting directives in report-only mode
          if [ "${{ matrix.mode }}" = "report-only" ]; then
            if echo "$CSP_POLICY" | grep -q "report-uri\|report-to"; then
              echo "✅ reporting directives found (report-only mode)"
            else
              echo "❌ reporting directives missing (report-only mode)"
              exit 1
            fi
          fi

          echo "🎉 CSP validation passed for ${{ matrix.mode }} mode!"

      - name: Generate CSP policy artifact
        run: |
          # Generate CSP policy for both modes and save as artifacts
          echo "CSP Policy for ${{ matrix.mode }} mode:" > csp-policy-${{ matrix.mode }}.txt
          echo "===========================================" >> csp-policy-${{ matrix.mode }}.txt
          echo "" >> csp-policy-${{ matrix.mode }}.txt

          # Get the actual policy from the running server
          HEADERS=$(curl -s -I http://localhost:3000)
          if [ "${{ matrix.mode }}" = "enforce" ]; then
            CSP_POLICY=$(echo "$HEADERS" | grep "Content-Security-Policy:" | cut -d: -f2- | xargs)
          else
            CSP_POLICY=$(echo "$HEADERS" | grep "Content-Security-Policy-Report-Only:" | cut -d: -f2- | xargs)
          fi

          echo "$CSP_POLICY" >> csp-policy-${{ matrix.mode }}.txt
          echo "" >> csp-policy-${{ matrix.mode }}.txt
          echo "Generated at: $(date)" >> csp-policy-${{ matrix.mode }}.txt

      - name: Upload CSP policy artifact
        uses: actions/upload-artifact@v4
        with:
          name: csp-policy-${{ matrix.mode }}
          path: csp-policy-${{ matrix.mode }}.txt
          retention-days: 30

      - name: Stop application
        run: |
          if [ -n "$SERVER_PID" ]; then
            echo "Stopping server with PID $SERVER_PID"
            kill $SERVER_PID || true
            sleep 2
            if ps -p $SERVER_PID > /dev/null; then
              echo "Force killing server"
              kill -9 $SERVER_PID || true
            fi
          else
            echo "No server PID found, using pkill"
            pkill -f "next start" || true
          fi
