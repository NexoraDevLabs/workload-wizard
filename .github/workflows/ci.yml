name: CI

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NODE_OPTIONS: '--max_old_space_size=4096'
  NEXT_DISABLE_SOURCEMAPS: '1'
  SENTRY_SKIP_AUTO_RELEASE: '1'
  SENTRY_SOURCEMAPS: 'false'
  SENTRY_SILENT: '1'
  SENTRY_TELEMETRY: 'false'
  # Build optimizations
  SKIP_ENV_VALIDATION: '1'
  CI: 'true'
  # npm optimizations
  PNPM_CACHE_FOLDER: '.npm-cache'
  # Dummy envs so server code doesn't crash in CI
  NEXT_PUBLIC_CONVEX_URL: 'https://example.invalid'
  CONVEX_DEPLOYMENT: 'https://example.invalid'
  FEATFLAG_STATSIG_SERVER_API_KEY: 'test_server_key'
  STATSIG_SERVER_SECRET_KEY: 'test_server_key'
  STATSIG_SERVER_API_KEY: 'test_server_key'
  CLERK_WEBHOOK_SECRET: 'test_webhook_secret'
  WEBHOOK_SECRET: 'test_webhook_secret'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup npm
        uses: npm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Get npm store directory
        shell: bash
        run: echo "STORE_PATH=$(npm store path --silent)" >> $GITHUB_ENV

      - name: Setup npm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-npm-store-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-store-

      - name: Install dependencies
        run: npm install --frozen-lockfile --prefer-offline

      - name: Build
        run: npm run build

      - name: Job Summary
        if: ${{ always() }}
        run: |
          {
            echo "## ✅ build completed"
            echo ""
            echo "- Workflow: **${{ github.workflow }}**"
            echo "- Ref: **${{ github.ref_name }}** (${GITHUB_SHA:0:7})"
            echo "- Runner: **${{ runner.os }}**"
            echo ""
            echo "### Key Outputs"
            echo "- Node: \`$(node -v)\`"
            echo "- npm: \`$(npm -v)\`"
            echo "- Status: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup npm
        uses: npm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Get npm store directory
        shell: bash
        run: echo "STORE_PATH=$(npm store path --silent)" >> $GITHUB_ENV

      - name: Setup npm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-npm-store-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-store-

      - name: Install dependencies
        run: npm install --frozen-lockfile --prefer-offline

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Job Summary
        if: ${{ always() }}
        run: |
          {
            echo "## ✅ lint completed"
            echo ""
            echo "- Workflow: **${{ github.workflow }}**"
            echo "- Ref: **${{ github.ref_name }}** (${GITHUB_SHA:0:7})"
            echo "- Runner: **${{ runner.os }}**"
            echo ""
            echo "### Key Outputs"
            echo "- Node: \`$(node -v)\`"
            echo "- npm: \`$(npm -v)\`"
            echo "- TypeScript: \`$(npx tsc -v)\`"
            echo "- Status: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup npm
        uses: npm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Get npm store directory
        shell: bash
        run: echo "STORE_PATH=$(npm store path --silent)" >> $GITHUB_ENV

      - name: Setup npm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-npm-store-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-store-

      - name: Install dependencies
        run: npm install --frozen-lockfile --prefer-offline

      - name: Run tests
        run: npm test -- --ci

      - name: Job Summary
        if: ${{ always() }}
        run: |
          {
            echo "## ✅ test completed"
            echo ""
            echo "- Workflow: **${{ github.workflow }}**"
            echo "- Ref: **${{ github.ref_name }}** (${GITHUB_SHA:0:7})"
            echo "- Runner: **${{ runner.os }}**"
            echo ""
            echo "### Key Outputs"
            echo "- Node: \`$(node -v)\`"
            echo "- npm: \`$(npm -v)\`"
            echo "- Test runner: **Vitest**"
            echo "- Status: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup npm
        uses: npm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Get npm store directory
        shell: bash
        run: echo "STORE_PATH=$(npm store path --silent)" >> $GITHUB_ENV

      - name: Setup npm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-npm-store-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-store-

      - name: Install dependencies
        run: npm install --frozen-lockfile --prefer-offline

      - name: Audit dependencies
        run: |
          echo "Running npm audit..."
          if npm audit --audit-level=high; then
            echo "✅ No high/critical vulnerabilities found"
          else
            echo "⚠️ Vulnerabilities found. Checking if they're from dev dependencies..."
            # Check if vulnerabilities are only in dev dependencies (like Vercel CLI)
            npm audit --audit-level=high --prod || echo "⚠️ Some vulnerabilities found in production dependencies"
          fi

      - name: Job Summary
        if: ${{ always() }}
        run: |
          {
            echo "## ✅ audit completed"
            echo ""
            echo "- Workflow: **${{ github.workflow }}**"
            echo "- Ref: **${{ github.ref_name }}** (${GITHUB_SHA:0:7})"
            echo "- Runner: **${{ runner.os }}**"
            echo ""
            echo "### Key Outputs"
            echo "- Node: \`$(node -v)\`"
            echo "- npm: \`$(npm -v)\`"
            echo "- Audit level: **high**"
            echo "- Status: **${{ job.status }}**"
            echo ""
            echo "### Notes"
            echo "- Vercel CLI may show vulnerabilities in dev dependencies (this is expected)"
            echo "- Production dependencies are audited separately"
          } >> "$GITHUB_STEP_SUMMARY"
