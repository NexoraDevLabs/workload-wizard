name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER) — @$AUTHOR'

categories:
  - title: '🚀 Features'
    labels: ['feat', 'feature', 'type/feat']
  - title: '🐛 Fixes'
    labels: ['fix', 'bug', 'type/bug']
  - title: '🧰 Maintenance'
    labels: ['chore', 'type/chore', 'deps', 'dependencies']
  - title: '🧪 Tests'
    labels: ['test', 'tests']
  - title: '🧱 CI/CD'
    labels: ['ci', 'area/ci']
  - title: '🗂 Docs'
    labels: ['docs', 'documentation']
  - title: '🔐 Security'
    labels: ['security']

template: |
  ## What’s Changed
  $CHANGES

  ## Contributors
  $CONTRIBUTORS

version-resolver:
  major:
    labels: ['major', 'breaking', 'breaking change']
  minor:
    labels: ['minor', 'feat', 'feature', 'type/feat']
  patch:
    labels: ['patch', 'fix', 'bug', 'type/bug', 'security']
  default: patch

autolabeler:
  - label: 'feat'
    title: ["/^feat(\\(.+\\))?:/i"]
  - label: 'fix'
    title: ["/^fix(\\(.+\\))?:/i"]
  - label: 'docs'
    title: ["/^docs(\\(.+\\))?:/i"]
  - label: 'chore'
    title: ["/^chore(\\(.+\\))?:/i"]
  - label: 'ci'
    title: ["/^ci(\\(.+\\))?:/i"]
    files: ['.github/workflows/**']
  - label: 'test'
    title: ["/^test(\\(.+\\))?:/i"]
    files: ['**/*.{spec,test}.{js,jsx,ts,tsx}', 'tests/**']
  - label: 'area/ui'
    files: ['app/**', 'components/**', 'styles/**']
  - label: 'area/api'
    files: ['app/api/**', 'convex/**', 'src/server/**']

replacers:
  - search: "/\\n{3,}/"
    replace: "\n\n"
